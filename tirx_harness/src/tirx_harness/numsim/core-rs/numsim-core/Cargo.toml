[package]
name = "numsim-core"
version.workspace = true
edition.workspace = true
publish.workspace = true

[lib]
name = "numsim_core"
path = "src/lib.rs"

[dependencies]
numsim-types = { path = "../numsim-types" }
numsim-oplib = { path = "../numsim-oplib" }
serde.workspace = true
serde_json.workspace = true
postcard.workspace = true
# W7 codegen: load the generated cdylib; cache keys.
libloading = "=0.8.6"
sha2 = "=0.10.8"

[dev-dependencies]
# W4: replay numsim-oplib cvt goldens through resolve_ptx.
numsim-oplib = { path = "../numsim-oplib", features = ["goldens"] }
# W3: differential tests of sync::* against numsim-sync-ref (tests/sync_differential.rs).
numsim-sync-ref = { path = "../numsim-sync-ref" }
proptest = { version = "=1.6.0", default-features = false, features = ["std"] }
# W7: interp vs codegen bench (benches/codegen.rs).
criterion = { version = "=0.5.1", default-features = false }

[[bench]]
name = "codegen"
harness = false
