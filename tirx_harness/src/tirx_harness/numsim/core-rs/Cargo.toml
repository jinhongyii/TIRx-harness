[workspace]
resolver = "2"
members = ["numsim-types", "numsim-core", "numsim-py", "numsim-oplib", "numsim-sync-ref", "numsim-sync-explore", "numsim-race-core"]

[workspace.package]
version = "0.1.0"
edition = "2021"
publish = false

[workspace.dependencies]
serde = { version = "=1.0.229", features = ["derive"] }
serde_json = "=1.0.151"
postcard = { version = "=1.1.3", default-features = false, features = ["use-std"] }
pyo3 = { version = "=0.29.0" }

[profile.release]
debug = 1
