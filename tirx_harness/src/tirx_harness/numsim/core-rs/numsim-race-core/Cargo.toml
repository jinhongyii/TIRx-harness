[package]
name = "numsim-race-core"
version = "0.1.0"
edition = "2021"
publish = false
description = "Benchmarks for the racecheck core (numsim_core::racecheck): packed stamps, exact-hit update, chunk join memo, witness packing."

[lib]
name = "numsim_race_core"
path = "src/lib.rs"

[dependencies]
numsim-core = { path = "../numsim-core" }
serde_json.workspace = true

[dev-dependencies]
criterion = { version = "=0.5.1", default-features = false }

[[bench]]
name = "core"
harness = false
