[package]
name = "numsim-sync-explore"
version = "0.1.0"
edition = "2021"
publish = false
description = "Prototype offline Synccheck explorer over a local SyncEvent log: per-warp programs, projection, sleep-set DFS, causal certificates, fingerprint dedup."

[lib]
name = "numsim_sync_explore"
path = "src/lib.rs"

[dependencies]

[dev-dependencies]
criterion = { version = "0.5", default-features = false, features = ["cargo_bench_support"] }

[[bench]]
name = "pipeline"
harness = false

# Standalone until the coordinator adds this crate to the core-rs workspace.
