[package]
name = "numsim-sync-explore"
version = "0.1.0"
edition = "2021"
publish = false
description = "Benchmarks for the Synccheck explorer (numsim-core::synccheck): visited states and time per reduction on a synthetic pipeline."

[lib]
name = "numsim_sync_explore"
path = "src/lib.rs"

[dependencies]
numsim-core = { path = "../numsim-core" }

[dev-dependencies]
criterion = { version = "=0.5.1", default-features = false, features = ["cargo_bench_support"] }

[[bench]]
name = "pipeline"
harness = false
