[package]
name = "numsim-sync-ref"
version = "0.1.0"
edition = "2021"
publish = false
description = "Executable reference state machines for NumSim synchronization protocols (test oracle; not linked into production)."

# Executable spec that the production `numsim-core::sync` step functions are
# differentially tested against. It must not depend on numsim-core (no shared
# code), so it has no dependencies.
[dependencies]

[dev-dependencies]
proptest = { version = "=1.6.0", default-features = false, features = ["std"] }
