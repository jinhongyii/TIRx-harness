[package]
name = "numsim-sync-ref"
version = "0.1.0"
edition = "2021"
publish = false
description = "Executable reference state machines for NumSim synchronization protocols (test oracle; not linked into production)."

# Standalone on purpose: this crate is the executable spec that the production
# SyncTable `step` functions are differentially tested against. It must not
# share code with them, so it is not a member of the core-rs workspace.
[dependencies]

[dev-dependencies]
proptest = { version = "=1.6.0", default-features = false, features = ["std"] }
